<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tách Ảnh AI - WhaleTeam_R</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --hover-bg: #f9fafb;
            --hover-border: rgba(26, 115, 232, 0.5);
            --hover-glow: rgba(26, 115, 232, 0.15);
            --primary-blue: #1a73e8;
            --primary-hover: #1557b0;
        }

        body.dark-mode {
            --bg-color: #121316;
            --card-bg: #1a1b1e;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #8e9297;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --hover-bg: #2b2d31;
            --hover-border: rgba(26, 115, 232, 0.5);
            --hover-glow: rgba(26, 115, 232, 0.2);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* LOGO CÔNG TY / TRANG WEB (TOP-LEFT) */
        .brand-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-logo img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .brand-logo span {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* HEADER ACTIONS (TOP-RIGHT) */
        .header-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .action-btn {
            height: 48px;
            width: max-content;
            min-width: 48px;
            max-width: 48px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            box-shadow: 0 4px 15px var(--shadow-color);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: max-width 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.3s ease, 
                        border-color 0.3s ease,
                        transform 0.2s ease;
        }

        .btn-icon-wrapper {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-main);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .btn-label {
            white-space: nowrap;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            opacity: 0;
            transform: translateX(-8px);
            padding-right: 16px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .action-btn:not(.expanded):hover {
            max-width: 220px;
            border-color: var(--hover-border);
            box-shadow: 0 4px 15px var(--hover-glow);
            transform: translateY(-2px) scale(1.02);
        }

        .action-btn:not(.expanded):hover .btn-label {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.25s ease 0.12s, transform 0.25s ease 0.12s;
        }

        .action-btn:not(.expanded):active {
            transform: scale(0.95);
        }

        /* SETTINGS EXPANDABLE BOX */
        #settingBtn {
            transform-origin: top right;
        }

        #settingBtn.expanded {
            width: 280px !important;
            max-width: 280px !important;
            height: 210px !important;
            border-radius: 20px;
            cursor: default;
            border-color: var(--hover-border);
            box-shadow: 0 12px 35px var(--shadow-color), 0 0 15px var(--hover-glow);
            align-items: stretch;
            justify-content: stretch;
        }

        #settingBtn.expanded > .btn-icon-wrapper,
        #settingBtn.expanded > .btn-label {
            display: none !important;
        }

        .setting-content-inner {
            display: none;
            width: 100%;
            height: 100%;
            padding: 18px;
            flex-direction: column;
            gap: 14px;
            opacity: 0;
            transition: opacity 0.25s ease 0.1s;
        }

        #settingBtn.expanded .setting-content-inner {
            display: flex;
            opacity: 1;
        }

        .setting-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setting-header h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-setting-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        .close-setting-btn:hover {
            background-color: var(--hover-bg);
        }

        .setting-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }

        .setting-item select {
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
            font-size: 13px;
        }

        /* THEME TOGGLE ICON */
        #themeToggle .icon-sun { display: block; }
        #themeToggle .icon-moon { display: none; }
        body.dark-mode #themeToggle .icon-sun { display: none; }
        body.dark-mode #themeToggle .icon-moon { display: block; }

        /* KHU VỰC CHÍNH */
        .main-container {
            width: 100%;
            max-width: 960px;
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .tool-header {
            text-align: center;
        }

        .tool-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tool-header p {
            color: var(--text-sub);
            font-size: 15px;
        }

        .upload-card {
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 24px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .upload-card:hover {
            border-color: var(--primary-blue);
            background: var(--hover-bg);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--hover-glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--primary-blue);
            fill: none;
            stroke-width: 2;
        }

        .upload-btn-main {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 28px;
            background: var(--primary-blue);
            color: #fff;
            font-weight: 600;
            border-radius: 30px;
            transition: background 0.2s ease;
        }

        .upload-btn-main:hover {
            background: var(--primary-hover);
        }

        #fileInput {
            display: none;
        }

        .workspace {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 20px var(--shadow-color);
            flex-direction: column;
            gap: 20px;
        }

        .image-preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .image-preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .preview-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-height: 260px;
            justify-content: center;
        }

        .preview-box h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 240px;
            object-fit: contain;
            border-radius: 8px;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .download-opts {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
        }
    </style>
</head>
<body>

<!-- LOGO TRANG WEB (KHU VỰC GÓC TRÁI) -->
<a href="index.html" class="brand-logo">
    <img src="Logo.png" alt="Logo">
    <span>WhaleTeam_R</span>
</a>

<!-- HEADER ACTIONS (GÓC PHẢI) -->
<div class="header-actions">

    <!-- 1. NÚT ĐĂNG NHẬP / TÀI KHOẢN (LOGIN) -->
    <a href="login.html" class="action-btn" id="loginBtn" aria-label="Login">
        <div class="btn-icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <span class="btn-label">Đăng nhập</span>
    </a>

    <!-- 2. NÚT SETTINGS -->
    <div class="action-btn" id="settingBtn" role="button" aria-label="Settings">
        <div class="btn-icon-wrapper">
            <svg class="icon-gear" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
        <span class="btn-label">Settings</span>

        <div class="setting-content-inner">
            <div class="setting-header">
                <h4>
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill:none; stroke:currentColor; stroke-width:2;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Settings
                </h4>
                <button type="button" class="close-setting-btn" id="closeSettingBtn" aria-label="Close Settings">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill:none; stroke:currentColor; stroke-width:2;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="setting-body">
                <div class="setting-item">
                    <span>Thông báo</span>
                    <input type="checkbox" checked>
                </div>
                <div class="setting-item">
                    <span>Tự động xử lý</span>
                    <input type="checkbox" checked>
                </div>
                <div class="setting-item">
                    <span>Ngôn ngữ</span>
                    <select>
                        <option>Tiếng Việt</option>
                        <option>English</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. NÚT CHUYỂN BẬT TẮT THEME SÁNG / TỐI -->
    <button id="themeToggle" class="action-btn" aria-label="Toggle Theme">
        <div class="btn-icon-wrapper">
            <svg class="icon-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
        <span class="btn-label mode-text">Light</span>
    </button>

</div>

<!-- KHU VỰC CÔNG CỤ TÁCH ẢNH -->
<div class="main-container">
    <div class="tool-header">
        <h1>Tách Ảnh AI</h1>
        <p>Phân tách các chi tiết và đối tượng trong hình ảnh bằng trí tuệ nhân tạo.</p>
    </div>

    <!-- KHU VỰC UPLOAD -->
    <div class="upload-card" id="dropZone">
        <div class="upload-icon">
            <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        </div>
        <h3>Kéo & thả hình ảnh vào đây</h3>
        <p style="color: var(--text-sub); font-size: 13px; margin-top: 4px;">Hoặc nhấp vào bên dưới để chọn file từ máy tính (PNG, JPG, WEBP)</p>
        <span class="upload-btn-main">Chọn file ảnh</span>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- KHU VỰC XỬ LÝ & KẾT QUẢ TÁCH ẢNH -->
    <div class="workspace" id="workspace">
        <div class="image-preview-grid">
            <div class="preview-box">
                <h3>Ảnh gốc</h3>
                <img id="originalPreview" src="" alt="Original Image">
            </div>
            <div class="preview-box">
                <h3>Kết quả tách ảnh</h3>
                <img id="processedPreview" src="" alt="Processed Image">
            </div>
        </div>

        <div class="control-bar">
            <button class="btn-action btn-secondary" id="reuploadBtn">Tải ảnh khác</button>
            <div class="download-opts">
                <select id="downloadFormat" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main);">
                    <option value="png">PNG HD</option>
                    <option value="jpg">JPG HD</option>
                    <option value="webp">WEBP</option>
                </select>
                <button class="btn-action btn-primary" id="downloadBtn">Tải ảnh về</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. CHỦ ĐỀ DARK/LIGHT MODE
    const themeToggleBtn = document.getElementById("themeToggle");
    const modeText = themeToggleBtn ? themeToggleBtn.querySelector(".mode-text") : null;
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        if (modeText) modeText.textContent = "Dark";
    } else {
        if (modeText) modeText.textContent = "Light";
    }

    if (themeToggleBtn) {
        themeToggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            if (modeText) {
                modeText.textContent = isDark ? "Dark" : "Light";
            }
            localStorage.setItem("theme", isDark ? "dark" : "light");
        });
    }

    // 2. NÚT SETTINGS EXPANDABLE
    const settingBtn = document.getElementById('settingBtn');
    const closeSettingBtn = document.getElementById('closeSettingBtn');

    if (settingBtn) {
        settingBtn.addEventListener('click', () => {
            if (!settingBtn.classList.contains('expanded')) {
                settingBtn.classList.add('expanded');
            }
        });

        if (closeSettingBtn) {
            closeSettingBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                settingBtn.classList.remove('expanded');
            });
        }

        document.addEventListener('click', (e) => {
            if (settingBtn.classList.contains('expanded') && !settingBtn.contains(e.target)) {
                settingBtn.classList.remove('expanded');
            }
        });
    }

    // 3. UPLOAD & XỬ LÝ TÁCH ẢNH
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const originalPreview = document.getElementById('originalPreview');
    const processedPreview = document.getElementById('processedPreview');
    const reuploadBtn = document.getElementById('reuploadBtn');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--primary-blue)';
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = 'var(--border-color)';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border-color)';
        if (e.dataTransfer.files.length) {
            handleImageUpload(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleImageUpload(e.target.files[0]);
        }
    });

    function handleImageUpload(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            originalPreview.src = e.target.result;
            processedPreview.src = e.target.result;
            dropZone.style.display = 'none';
            workspace.style.display = 'flex';
        }
        reader.readAsDataURL(file);
    }

    reuploadBtn.addEventListener('click', () => {
        fileInput.value = '';
        dropZone.style.display = 'block';
        workspace.style.display = 'none';
    });
</script>

</body>
</html>
