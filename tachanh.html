<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Tách Ảnh - WhaleTeam_R</title>
    <link rel="icon" type="image/png" href="Logo.png">
    
    <!-- Thư viện AI xử lý tách nền tự động chạy trực tiếp trên trình duyệt -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --hover-bg: #f9fafb;
            --hover-border: rgba(26, 115, 232, 0.5);
            --hover-glow: rgba(26, 115, 232, 0.15);
        }

        body.dark-mode {
            --bg-color: #121316;
            --card-bg: #1a1b1e;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #8e9297;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --hover-bg: #2b2d31;
            --hover-border: rgba(26, 115, 232, 0.5);
            --hover-glow: rgba(26, 115, 232, 0.2);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* HEADER ACTIONS & NÚT NỔI */
        .header-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .action-btn {
            height: 48px;
            width: max-content;
            min-width: 48px;
            max-width: 48px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            box-shadow: 0 4px 15px var(--shadow-color);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: max-width 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.3s ease, 
                        border-color 0.3s ease,
                        transform 0.2s ease;
        }

        .btn-icon-wrapper {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-main);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .btn-label {
            white-space: nowrap;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            opacity: 0;
            transform: translateX(-8px);
            padding-right: 16px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .action-btn:hover {
            max-width: 220px;
            border-color: var(--hover-border);
            box-shadow: 0 4px 15px var(--hover-glow);
            transform: translateY(-2px) scale(1.02);
        }

        .action-btn:hover .btn-label {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.25s ease 0.12s, transform 0.25s ease 0.12s;
        }

        #themeToggle .icon-sun { display: block; }
        #themeToggle .icon-moon { display: none; }
        body.dark-mode #themeToggle .icon-sun { display: none; }
        body.dark-mode #themeToggle .icon-moon { display: block; }

        /* NỘI DUNG CHÍNH CÔNG CỤ TÁCH ẢNH */
        .tool-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 25px var(--shadow-color);
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .tool-header {
            text-align: center;
        }

        .tool-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .tool-header p {
            font-size: 14px;
            color: var(--text-sub);
        }

        /* KHU VỰC UPLOAD ẢNH */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--hover-bg);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .upload-area:hover {
            border-color: #1a73e8;
            box-shadow: 0 0 15px var(--hover-glow);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            stroke: var(--text-sub);
            stroke-width: 1.8;
            fill: none;
        }

        .upload-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-sub);
        }

        #fileInput { display: none; }

        /* HIỂN THỊ KẾT QUẢ SO SÁNH */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .preview-grid { grid-template-columns: 1fr; }
        }

        .preview-box {
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-height: 250px;
            justify-content: center;
            position: relative;
        }

        .preview-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-sub);
            align-self: flex-start;
        }

        .img-container {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
            /* Nền cờ ca-rô để dễ thấy ảnh trong suốt */
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), 
                              linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #ccc 75%), 
                              linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* NÚT TẢI VỀ & LOADING */
        .btn-download {
            padding: 10px 24px;
            border-radius: 12px;
            background-color: #1a73e8;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }

        .loading-spinner {
            display: none;
            width: 32px;
            height: 32px;
            border: 4px solid var(--border-color);
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- NÚT ĐIỀU HƯỚNG TRÊN CÙNG -->
    <div class="header-actions">
        
 <!-- 1. LOGIN -->
    <a href="login.html" class="action-btn" id="loginBtn" aria-label="Login">
        <div class="btn-icon-wrapper">
            <svg viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </div>
        <span class="btn-label">Login</span>
    </a>

    <!-- 2. SETTINGS BUTTON -->
    <div class="action-btn" id="settingBtn" role="button" aria-label="Settings">
        <div class="btn-icon-wrapper">
            <svg class="icon-gear" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
        <span class="btn-label">Settings</span>

        <div class="setting-content-inner">
            <div class="setting-header">
                <h4>
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Settings
                </h4>
                <button type="button" class="close-setting-btn" id="closeSettingBtn" aria-label="Close Settings">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="setting-body">
                <div class="setting-item">
                    <span>Thông báo</span>
                    <input type="checkbox" checked>
                </div>
                <div class="setting-item">
                    <span>Tự động phát</span>
                    <input type="checkbox">
                </div>
                <div class="setting-item">
                    <span>Ngôn ngữ</span>
                    <select>
                        <option>Tiếng Việt</option>
                        <option>English</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

        <button id="themeToggle" class="action-btn" aria-label="Toggle Theme">
            <div class="btn-icon-wrapper">
                <svg class="icon-sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </div>
            <span class="btn-label mode-text">Light</span>
        </button>
    </div>

    <!-- KHU VỰC LOGO TỰ ĐỘNG GỌI TỪ LOGO.HTML -->
    <div id="logo-container"></div>

    <!-- KHU VỰC CHÍNH CỦA CÔNG CỤ TÁCH ẢNH -->
    <div class="tool-container">
        <div class="tool-header">
            <h1>Công cụ Tách Ảnh AI</h1>
            <p>Tự động loại bỏ phông nền ảnh nhanh chóng & chuẩn xác (Định dạng PNG trong suốt)</p>
        </div>

        <div class="upload-area" id="dropZone">
            <svg class="upload-icon" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span class="upload-text">Bấm vào đây hoặc kéo thả ảnh vào để tách nền</span>
            <span class="upload-hint">Hỗ trợ các định dạng PNG, JPG, JPEG, WEBP</span>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-grid" id="previewGrid" style="display: none;">
            <div class="preview-box">
                <span class="preview-title">Ảnh gốc</span>
                <div class="img-container">
                    <img id="originalImg" src="" alt="Ảnh gốc">
                </div>
            </div>

            <div class="preview-box">
                <span class="preview-title">Kết quả đã tách nền</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
                <div class="img-container" id="resultContainer" style="display: none;">
                    <img id="resultImg" src="" alt="Kết quả">
                </div>
                <a id="downloadBtn" class="btn-download" style="display: none;" download="tach-nen.png">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Tải ảnh PNG
                </a>
            </div>
        </div>
    </div>

    <script>
        // 1. CHỨC NĂNG GỌI LOGO.HTML
        fetch('logo.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('logo-container').innerHTML = data;
                const brandLogo = document.querySelector('.brand-logo');
                if (brandLogo) {
                    setTimeout(() => {
                        brandLogo.classList.remove('intro-animation');
                    }, 2200);
                }
            })
            .catch(err => console.error('Lỗi khi tải logo:', err));

        // 2. CHỨC NĂNG DARK / LIGHT MODE (ĐỒNG BỘ LOCALSTORAGE)
        const themeToggleBtn = document.getElementById("themeToggle");
        const modeText = themeToggleBtn ? themeToggleBtn.querySelector(".mode-text") : null;
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark-mode");
            if (modeText) modeText.textContent = "Dark";
        } else {
            if (modeText) modeText.textContent = "Light";
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                const isDark = document.body.classList.contains("dark-mode");
                if (modeText) modeText.textContent = isDark ? "Dark" : "Light";
                localStorage.setItem("theme", isDark ? "dark" : "light");
            });
        }

        // 3. XỬ LÝ UPLOAD VÀ TÁCH NỀN BẰNG AI
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');
        const originalImg = document.getElementById('originalImg');
        const resultImg = document.getElementById('resultImg');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const resultContainer = document.getElementById('resultContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) processImage(file);
        });

        // Kéo thả file vào ô upload
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#1a73e8';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'var(--border-color)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border-color)';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                processImage(file);
            }
        });

        // Hàm xử lý tách nền tự động
        async function processImage(file) {
            previewGrid.style.display = 'grid';
            originalImg.src = URL.createObjectURL(file);
            
            // Hiện trạng thái Loading
            loadingSpinner.style.display = 'block';
            resultContainer.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                // Gọi thư viện AI imgly-background-removal
                const imageBlob = await imglyRemoveBackground(file);
                const resultUrl = URL.createObjectURL(imageBlob);

                resultImg.src = resultUrl;
                downloadBtn.href = resultUrl;

                // Ẩn Loading, hiện kết quả
                loadingSpinner.style.display = 'none';
                resultContainer.style.display = 'flex';
                downloadBtn.style.display = 'inline-flex';
            } catch (error) {
                console.error("Lỗi tách nền:", error);
                alert("Rất tiếc, đã có lỗi xảy ra khi tách nền. Vui lòng thử lại với ảnh khác!");
                loadingSpinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
