<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleTeam_R Webside</title>
    <link rel="icon" type="image/png" href="Logo - 1 - Edited.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {

            background-color: transparent;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .card {
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 500px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: scale(1.025) ;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15), 0 0 15px #4da6ff;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 12px;
            font-size: 24px;
            transition: all 0.4s ease;
        }
       
        h1:hover {
            transform: scale(1.05);
            text-shadow: 0 0 15px #4da6ff, 0 0 30px #4da6ff;
        }
        p {
            color: #444;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #388af5;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
         a:hover {
            transform: scale(1.05);
            text-shadow: 0 0 15px #4da6ff, 0 0 30px #4da6ff;
        }
        #myVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 12px;
        }
        /* Đặt vị trí khối logo ở góc trên bên trái */
        .brand-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px; /* Khoảng cách giữa ảnh logo và chữ */
            z-index: 100;
        }

/* Chỉnh kích thước và bo góc ảnh logo */
        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%; /* Bo tròn nếu muốn logo dạng hình tròn */
        }
    
/* Style cho tên web bên cạnh logo */
        .brand-name {
            font-family: 'Nunito', sans-serif;
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 1);
        }

        
        body.dark-mode .card {
            background: rgba(20, 20, 25, 0.65);
        }
   .bg-media {
     width: 100vw;
     height: 100vh;
     object-fit: cover;
     z-index: -2;
   }

        
        body.dark-mode .icon-btn {
            background: rgba(30, 30, 35, 0.85);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        body.dark-mode .icon-btn:hover {
            background: rgba(60, 60, 65, 1);
        }
        
        body.dark-mode p {
            color: #b0b0b0;
        }
        
        body.dark-mode h1 {
            color: #4da6ff;
        }
    }
    </style>
</head>
<body>
    <!-- KHỐI LOGO GÓC TRÊN BÊN TRÁI -->
    <div class="brand-logo">
        <img src="Logo - 1 - Edited.png" alt="Logo" class="logo-img">
        <span class="brand-name">SLEEPY WHALE</span>
    </div>

    
    <div class="top-controls">
        <button id="themeToggle" class="icon-btn" title="Chuyển chế độ Sáng/Tối">🌓</button>
        <button id="settingsBtn" class="icon-btn" title="Cài đặt">⚙️</button>
    </div>
    
    
    <video autoplay muted loop playsinline preload="auto" id="myVideo">
        <source src="WhaleDreams .mp4" type="video/mp4">
    </video>

    <canvas id="particle-canvas"></canvas>

    <div class="card">
        <h1><b>CHÀO MỪNG ĐẾN VỚI WhaleTeam_R!</b></h1>
        <p><i>Web hiện đang trong quá trình hoàn thành!</i></p>
        <a href="main-menu.html" class="btn">Bắt đầu</a>
        <a href="https://discord.gg/JBVCSDFp2" target="_blank" class="btn">Tham gia sever Discord của chúng tôi</a>
        <a href="https://whaleteamr.github.io/aaaaad/" id="robux-btn" class="btn">1000 Robux free!!!</a>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 6; 
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * -2 - 0.5;
                this.life = 70;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.3) this.size -= 0.08;
                this.life -= 1;
            }
            draw() {
               
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(173, 216, 230, 0.12)';
                ctx.fill();

             
                ctx.lineWidth = Math.max(0.6, this.size * 0.08);
                ctx.strokeStyle = 'rgba(70, 160, 240, 0.6)';
                ctx.stroke();

              
                ctx.beginPath();
                ctx.arc(
                    this.x - this.size * 0.35, 
                    this.y - this.size * 0.35, 
                    Math.max(0.5, this.size * 0.22), 
                    0, 
                    Math.PI * 2
                );
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();
            }
        }
        function createParticles(e) {
           if (Math.random() < 0.3) {
        particles.push(new Particle(e.clientX, e.clientY));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', createParticles);
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
        
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });

     
        const settingsBtn = document.getElementById('settingsBtn');
        settingsBtn.addEventListener('click', function() {
            alert('Chức năng cài đặt đang được phát triển!');
        });
        
    </script>
</body>
</html>
