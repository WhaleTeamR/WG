<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleTeam_R - Hiệu ứng chuột hạt xanh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {

            background-color: transparent;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .card {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 500px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 12px;
            font-size: 28px;
        }
        p {
            color: #444;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #1557b0;
        }
        
        #myVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }
        /* Vị trí cụm nút góc trên phải */
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 12px;
        }

        /* Nút hình tròn mờ kính */
        .icon-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 1);
        }

        /* Chế độ Tối (Dark Mode) cho Card */
        body.dark-mode .card {
            background: rgba(20, 20, 25, 0.85);
        }
   .bg-media {
     width: 100vw;
     height: 100vh;
     object-fit: cover;
     z-index: -2;
   }
    </style>
</head>
<body>

    <!-- Cụm nút góc trên bên phải -->
    <div class="top-controls">
        <button id="themeToggle" class="icon-btn" title="Chuyển chế độ Sáng/Tối">🌓</button>
        <button id="settingsBtn" class="icon-btn" title="Cài đặt">⚙️</button>
    </div>
    
    <!-- Sửa 3: Nếu trên GitHub bạn đã đổi tên file thành mainmenubackground.mp4 thì sửa src tương ứng -->
    <video autoplay muted loop playsinline id="myVideo">
        <source src="WhaleDreams .mp4" type="video/mp4">
    </video>

    <canvas id="particle-canvas"></canvas>

    <div class="card">
        <h1>CHÀO MỪNG ĐẾN VỚI WhaleTeam_R! 👋</h1>
        <p>Web hiện đang trong quá trình hoàn thành!</p>
        <a href="https://discord.gg/JBVCSDFp2" target="_blank" class="btn">Tham gia sever Discord của chúng tôi</a>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 6; // Tăng kích thước cho rõ dáng bong bóng
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * -2 - 0.5; // Bong bóng nhẹ nhàng trôi lên
                this.life = 70;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.3) this.size -= 0.08;
                this.life -= 1;
            }
            draw() {
                // 1. Vẽ thân bong bóng mờ
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(173, 216, 230, 0.12)';
                ctx.fill();

                // 2. Vẽ viền xanh nhạt
                ctx.lineWidth = Math.max(0.6, this.size * 0.08);
                ctx.strokeStyle = 'rgba(70, 160, 240, 0.6)';
                ctx.stroke();

                // 3. Vẽ điểm sáng phản quang 3D góc trên bên trái
                ctx.beginPath();
                ctx.arc(
                    this.x - this.size * 0.35, 
                    this.y - this.size * 0.35, 
                    Math.max(0.5, this.size * 0.22), 
                    0, 
                    Math.PI * 2
                );
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();
            }
        }
        function createParticles(e) {
           if (Math.random() < 0.3) {
        particles.push(new Particle(e.clientX, e.clientY));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', createParticles);
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
        
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });

        // Xử lý nút Cài đặt (Hiển thị thông báo tạm)
        const settingsBtn = document.getElementById('settingsBtn');
        settingsBtn.addEventListener('click', function() {
            alert('Chức năng cài đặt đang được phát triển!');
        });
        
    </script>
</body>
</html>
