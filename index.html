<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Whale</title>
    <link rel="icon" type="image/png" href="Logo - 1 - Edited.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: transparent;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
    }

    #particle-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
    }

    /* CARD CHÍNH */
    .card {
        background: rgba(255, 255, 255, 0.7); 
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); /* Đã dọn dẹp trùng lặp */
        max-width: 500px;
        text-align: center;
        position: relative;
        z-index: 1;
        transition: all 0.4s ease;
    }

    .card:hover {
        transform: scale(1.025);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15), 0 0 15px #4da6ff;
    }

    h1 {
        font-family: 'Nunito', sans-serif;
        color: #1a73e8;
        margin-bottom: 12px;
        font-size: 24px;
        transition: all 0.4s ease;
    }

    h1:hover {
        transform: scale(1.05);
        text-shadow: 0 0 15px #4da6ff, 0 0 30px #4da6ff;
    }

    p {
        color: #444;
        line-height: 1.6;
        margin-bottom: 24px;
    }

    /* NÚT BẤM */
    .btn {
        display: block;
        width: 380px;
        max-width: 100%; /* Giúp responsive tốt trên điện thoại */
        margin: 12px auto 0 auto;
        padding: 12px 24px;
        background-color: #1a73e8;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-weight: bold;
        transition: all 0.3s ease;
    }

    .btn:hover {
        background-color: #388af5;
        transform: scale(1.05);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    /* VIDEO NỀN */
    #myVideo, .bg-media {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
    }

    /* CONTROLS GÓC PHẢI */
    .top-controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        gap: 12px;
    }

    /* BRAND LOGO GÓC TRÁI */
    .brand-logo {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 16px 6px 10px;
        border-radius: 50px;
        
        background: rgba(255, 255, 255, 0.65);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.4); /* Đã thay biến var bằng màu thực */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease;
    }

    .brand-logo:hover {
        transform: scale(1.025);
        border-color: rgba(16, 185, 129, 0.4);
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
    }

    .logo-img {
        width: 45px;
        height: 45px;
        object-fit: contain;
        border-radius: 50%;
    }

/* 1. KHUNG CHỨA CHỮ (MẶC ĐỊNH NHẤP NHÁY CẢ DÒNG) */
.brand-name {
    display: flex;
    align-items: center;
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #1a73e8;
    letter-spacing: 0.5px;

    /* Hoạt ảnh nhấp nháy to nhỏ toàn bộ dòng */
    animation: pulse-whole 1.8s infinite ease-in-out;
    transition: transform 0.3s ease;
}

/* Kiểu nhấp nháy to nhỏ toàn dòng */
@keyframes pulse-whole {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08); /* Phóng to nhẹ toàn bộ chữ */
        text-shadow: 0 0 10px rgba(26, 115, 232, 0.5);
    }
}

/* ------------------------------------------------------------- */

/* 2. ĐỊNH DẠNG TỪNG CHỮ CÁI */
.brand-name span {
    display: inline-block;
}

.brand-name span.space {
    width: 6px;
}

/* Kiểu gợn sóng cho từng chữ cái */
@keyframes wave {
    0%, 100% {
        transform: scale(1) translateY(0);
    }
    20% {
        transform: scale(1.3) translateY(-3px);
        text-shadow: 0 0 10px rgba(26, 115, 232, 0.6);
    }
    40% {
        transform: scale(1) translateY(0);
    }
}

/* ------------------------------------------------------------- */

/* 3. KHI RÊ CHUỘT VÀO KHUNG .brand-logo (HOVER) */

/* Tắt nhấp nháy cả dòng */
.brand-logo:hover .brand-name {
    animation: none;
}

/* Bật gợn sóng cho từng chữ cái + chạy độ trễ */
.brand-logo:hover .brand-name span {
    animation: wave 2s infinite ease-in-out;
}

.brand-logo:hover .brand-name span:nth-child(1)  { animation-delay: 0.0s; }
.brand-logo:hover .brand-name span:nth-child(2)  { animation-delay: 0.1s; }
.brand-logo:hover .brand-name span:nth-child(3)  { animation-delay: 0.2s; }
.brand-logo:hover .brand-name span:nth-child(4)  { animation-delay: 0.3s; }
.brand-logo:hover .brand-name span:nth-child(5)  { animation-delay: 0.4s; }
.brand-logo:hover .brand-name span:nth-child(6)  { animation-delay: 0.5s; }
.brand-logo:hover .brand-name span:nth-child(8)  { animation-delay: 0.7s; }
.brand-logo:hover .brand-name span:nth-child(9)  { animation-delay: 0.8s; }
.brand-logo:hover .brand-name span:nth-child(10) { animation-delay: 0.9s; }
.brand-logo:hover .brand-name span:nth-child(11) { animation-delay: 1.0s; }
.brand-logo:hover .brand-name span:nth-child(12) { animation-delay: 1.1s; }
    /* ==========================================
   HOẠT ẢNH INTRO KHI MỚI VÀO TRANG WEB
   ========================================== */

/* 1. Mới vào: Giấu phần chữ và ẩn thanh cuộn thừa */
.brand-logo.intro-animation {
    overflow: hidden;
    animation: expandLogo 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

.brand-logo.intro-animation .brand-name {
    opacity: 0;
    animation: fadeInName 0.5s ease 0.6s forwards; /* Hiện chữ khi khung bắt đầu mở rộng */
}

/* 2. Ép các chữ cái gợn sóng ngay lập tức trong lúc chạy Intro */
.brand-logo.intro-animation .brand-name span {
    animation: wave 1.8s infinite ease-in-out;
}

.brand-logo.intro-animation .brand-name span:nth-child(1)  { animation-delay: 0.6s; }
.brand-logo.intro-animation .brand-name span:nth-child(2)  { animation-delay: 0.7s; }
.brand-logo.intro-animation .brand-name span:nth-child(3)  { animation-delay: 0.8s; }
.brand-logo.intro-animation .brand-name span:nth-child(4)  { animation-delay: 0.9s; }
.brand-logo.intro-animation .brand-name span:nth-child(5)  { animation-delay: 1.0s; }
.brand-logo.intro-animation .brand-name span:nth-child(6)  { animation-delay: 1.1s; }
.brand-logo.intro-animation .brand-name span:nth-child(8)  { animation-delay: 1.3s; }
.brand-logo.intro-animation .brand-name span:nth-child(9)  { animation-delay: 1.4s; }
.brand-logo.intro-animation .brand-name span:nth-child(10) { animation-delay: 1.5s; }
.brand-logo.intro-animation .brand-name span:nth-child(11) { animation-delay: 1.6s; }
.brand-logo.intro-animation .brand-name span:nth-child(12) { animation-delay: 1.7s; }

/* Keyframe kéo dài khung từ Tròn -> Dài */
@keyframes expandLogo {
    0% {
        width: 61px; /* Kích thước vừa khít ảnh tròn 45px + padding */
        padding-right: 8px;
    }
    40% {
        width: 61px;
    }
    100% {
        width: 235px; /* Kích thước bung đầy đủ chữ */
        padding-right: 16px;
    }
}

/* Keyframe hiện dần chữ */
@keyframes fadeInName {
    from { opacity: 0; }
    to { opacity: 1; }
}

    /* ICON BUTTONS */
    .icon-btn {
        background: rgba(255, 255, 255, 0.85);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: none;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .icon-btn:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 1);
    }

    /* DARK MODE */
    body.dark-mode .card {
        background: rgba(20, 20, 25, 0.65);
    }

    body.dark-mode .brand-logo {
        background: rgba(20, 20, 25, 0.55);
        border-color: rgba(255, 255, 255, 0.1);
    }

    body.dark-mode .icon-btn {
        background: rgba(30, 30, 35, 0.85);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    body.dark-mode .icon-btn:hover {
        background: rgba(60, 60, 65, 1);
    }

    body.dark-mode p {
        color: #b0b0b0;
    }

    body.dark-mode h1 {
        color: #4da6ff;
    }
</style>
</head>
<body>
    <!-- KHỐI LOGO GÓC TRÊN BÊN TRÁI -->
    <div class="brand-logo">
    <!-- Ảnh logo hình tròn -->
    <img src="Logo - 1 - Edited.png" alt="Logo" class="logo-img">
    
    <!-- Chữ gợn sóng từng ký tự -->
    <div class="brand-name">
        <span>S</span><span>L</span><span>E</span><span>E</span><span>P</span><span>Y</span>
        <span class="space">&nbsp;</span>
        <span>W</span><span>H</span><span>A</span><span>L</span><span>E</span>
    </div>
</div>

    
    <div class="top-controls">
        <button id="themeToggle" class="icon-btn" title="Chuyển chế độ Sáng/Tối">🌓</button>
        <button id="settingsBtn" class="icon-btn" title="Cài đặt">⚙️</button>
    </div>
    
    
    <video autoplay muted loop playsinline preload="auto" id="myVideo">
        <source src="WhaleDreams .mp4" type="video/mp4">
    </video>

    <canvas id="particle-canvas"></canvas>

    <div class="card">
        <h1><b>CHÀO MỪNG ĐẾN VỚI SLEEPYWHALE!</b></h1>
        <p><i>Web hiện đang trong quá trình hoàn thành!</i></p>
        <a href="main-menu.html" class="btn">Bắt đầu</a>
        <a href="https://discord.gg/JBVCSDFp2" target="_blank" class="btn">Tham gia sever Discord của chúng tôi</a>
        <a href="https://whaleteamr.github.io/aaaaad/" id="robux-btn" class="btn">1000 Robux free!!!</a>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 6; 
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * -2 - 0.5;
                this.life = 70;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.3) this.size -= 0.08;
                this.life -= 1;
            }
            draw() {
               
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(173, 216, 230, 0.12)';
                ctx.fill();

             
                ctx.lineWidth = Math.max(0.6, this.size * 0.08);
                ctx.strokeStyle = 'rgba(70, 160, 240, 0.6)';
                ctx.stroke();

              
                ctx.beginPath();
                ctx.arc(
                    this.x - this.size * 0.35, 
                    this.y - this.size * 0.35, 
                    Math.max(0.5, this.size * 0.22), 
                    0, 
                    Math.PI * 2
                );
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();
            }
        }
        function createParticles(e) {
           if (Math.random() < 0.3) {
        particles.push(new Particle(e.clientX, e.clientY));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', createParticles);
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
        
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });

     
        const settingsBtn = document.getElementById('settingsBtn');
        settingsBtn.addEventListener('click', function() {
            alert('Chức năng cài đặt đang được phát triển!');
        });
        document.addEventListener("DOMContentLoaded", () => {
        const brandLogo = document.querySelector('.brand-logo');
        if (brandLogo) {
            // Thêm class kích hoạt hiệu ứng mở đầu
            brandLogo.classList.add('intro-animation');

            // Xóa class sau khi chạy xong hiệu ứng (khoảng 3.2s) để trả về trạng thái hover bình thường
            setTimeout(() => {
                brandLogo.classList.remove('intro-animation');
            }, 3200);
        }
    });
        
    </script>
</body>
</html>
