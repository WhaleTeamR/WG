<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleTeam_R - Hiệu ứng chuột hạt xanh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            /* Sửa 1: Đổi thành transparent để lộ video phía sau */
            background-color: transparent;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Sửa 2: Hạ z-index xuống -1 để nằm TRÊN video (-2) nhưng DƯỚI card (1) */
            z-index: -1;
            pointer-events: none;
        }
        .card {
            background: rgba(255, 255, 255, 0.85); /* Thêm độ trong suốt mờ mờ cho đẹp */
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 500px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 12px;
            font-size: 28px;
        }
        p {
            color: #444;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #1557b0;
        }
        
        #myVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }
    </style>
</head>
<body>
    
    <!-- Sửa 3: Nếu trên GitHub bạn đã đổi tên file thành mainmenubackground.mp4 thì sửa src tương ứng -->
    <video autoplay muted loop playsinline id="myVideo">
        <source src="WhaleDreams .mp4" type="video/mp4">
    </video>

    <canvas id="particle-canvas"></canvas>

    <div class="card">
        <h1>CHÀO MỪNG ĐẾN VỚI WhaleTeam_R! 👋</h1>
        <p>Web hiện đang trong quá trình hoàn thành!</p>
        <a href="https://discord.gg/JBVCSDFp2" target="_blank" class="btn">Tham gia sever Discord của chúng tôi</a>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = 'rgba(26, 115, 232, 0.8)';
                this.life = 80;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.08;
                this.life -= 1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles(e) {
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(e.clientX, e.clientY));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', createParticles);
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
