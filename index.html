<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Whale</title>
    <link rel="icon" type="image/png" href="Logo - 1 - Edited.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background-color: transparent;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
    }

    #particle-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
    }

    /* VỊ TRÍ CONTAINER LOGO */
    #logo-container {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
    }

    /* CARD CHÍNH */
    .card {
        background: rgba(255, 255, 255, 0.7); 
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        max-width: 500px;
        text-align: center;
        position: relative;
        z-index: 1;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        opacity: 0;
        animation: slideDownCard 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 0.3s;
    }

    /* CHỈ XÓA ANIMATION LÚC LOAD, KHÔNG DÙNG !IMPORTANT CHO TRANSFORM ĐỂ TRÁNH GHI ĐÈ HOVER */
    body.skip-animation .card {
        opacity: 1;
        transform: none;
        animation: none;
    }

    body.skip-animation h1 {
        opacity: 1;
        transform: none;
        animation: none;
    }

    body.skip-animation .typing-container {
        opacity: 1;
    }

    body.skip-animation .typing-text {
        width: 100%;
        animation: none;
    }

    body.skip-animation .btn {
        opacity: 1;
        transform: none;
        animation: none;
    }

    body.skip-animation .icon-btn {
        opacity: 1;
        transform: none;
        animation: none;
    }

    @keyframes slideDownCard {
        0% { translate: 0 -150vh; opacity: 0; }
        100% { translate: 0 0; opacity: 1; }
    }

    .card:hover {
        transform: scale(1.025);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15), 0 0 15px #4da6ff;
    }

    /* H1 */
    h1 {
        font-family: 'Nunito', sans-serif;
        color: #1a73e8;
        margin-bottom: 12px;
        font-size: 24px;
        transition: transform 0.3s ease, text-shadow 0.3s ease;
        opacity: 0;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        animation-delay: 1.1s; 
    }

    @keyframes popIn {
        0% { scale: 0; opacity: 0; }
        80% { scale: 1.1; opacity: 1; }
        100% { scale: 1; opacity: 1; }
    }

    h1:hover {
        transform: scale(1.05);
        text-shadow: 0 0 15px #4da6ff, 0 0 30px #4da6ff;
    }

    p {
        color: #444;
        line-height: 1.6;
        margin-bottom: 24px;
    }

    /* ĐOẠN VĂN ĐÁNH MÁY */
    .typing-container {
        display: flex;
        justify-content: center;
        opacity: 0;
        animation: showTyping 0s forwards 1.7s; 
    }

    .typing-text {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        animation: typing 1.5s steps(40, end) forwards 1.7s; 
    }

    @keyframes showTyping { to { opacity: 1; } }
    @keyframes typing { from { width: 0; } to { width: 100%; } }

    /* NÚT BẤM */
    .btn {
        display: block;
        width: 380px;
        max-width: 100%; 
        margin: 12px auto 0 auto;
        padding: 12px 24px;
        background-color: #1a73e8;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-weight: bold;
        transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        opacity: 0;
        animation: popInBtn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    a.btn:nth-of-type(1) { animation-delay: 3.2s; }
    a.btn:nth-of-type(2) { animation-delay: 3.4s; }
    a.btn:nth-of-type(3) { animation-delay: 3.6s; }
    a.btn:nth-of-type(4) { animation-delay: 3.8s; }

    @keyframes popInBtn {
        0% { scale: 0; opacity: 0; }
        80% { scale: 1.05; opacity: 1; }
        100% { scale: 1; opacity: 1; }
    }

    .btn:hover {
        background-color: #388af5;
        transform: scale(1.05);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    
    .btn:active {
        transform: scale(0.95);
    }

    /* VIDEO NỀN */
    #myVideo, .bg-media {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
    }

    /* CONTROLS GÓC PHẢI */
    .top-controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    /* ICON BUTTONS */
    .icon-btn {
        background: rgba(255, 255, 255, 0.85);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: none;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        animation: spinAndScale 1.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
    }

    #themeToggle { animation-delay: 0.2s; }
    #settingsBtn { animation-delay: 0.35s; }

    @keyframes spinAndScale {
        0% { transform: scale(0) rotate(-360deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .icon-btn:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 1);
    }
    .icon-btn:active { 
        transform: scale(0.9); 
    }

    .icon-btn .nav-icon {
        width: 20px;
        height: 20px;
        stroke: #333333; 
        transition: stroke 0.3s ease;
    }

    .icon-moon { display: none; }

    /* DARK MODE */
    body.dark-mode .card { background: rgba(20, 20, 25, 0.65); }
    body.dark-mode .icon-btn {
        background: rgba(30, 30, 35, 0.85);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    body.dark-mode .icon-btn:hover { background: rgba(60, 60, 65, 1); }
    body.dark-mode p { color: #b0b0b0; }
    body.dark-mode h1 { color: #4da6ff; }
    body.dark-mode .icon-btn .nav-icon { stroke: #ffffff; }

    body.dark-mode .icon-sun { display: none; }
    body.dark-mode .icon-moon { display: block; }
</style>
</head>
<body>

    <div id="logo-container"></div>
    
    <div class="top-controls">
        <button id="themeToggle" class="icon-btn" title="Chuyển chế độ Sáng/Tối">
            <svg class="nav-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="nav-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <button id="settingsBtn" class="icon-btn" title="Cài đặt">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
