S<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Whale</title>
    <link rel="icon" type="image/png" href="Logo - 1 - Edited.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background-color: transparent;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
    }

    #particle-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
    }

    /* VỊ TRÍ CONTAINER LOGO */
    #logo-container {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
    }

    /* CARD CHÍNH */
    .card {
        background: rgba(255, 255, 255, 0.7); 
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        max-width: 500px;
        text-align: center;
        position: relative;
        z-index: 1;
        transition: all 0.4s ease;
        opacity: 0;
        animation: slideDownCard 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 0.3s;
    }

    /* Khi đã xem rồi hoặc người dùng bấm background thì bỏ hoạt ảnh */
    body.skip-animation .card {
        opacity: 1 !important;
        transform: translate(0, 0) !important;
        animation: none !important;
    }

    body.skip-animation h1 {
        opacity: 1 !important;
        transform: scale(1) !important;
        animation: none !important;
    }

    body.skip-animation .typing-container {
        opacity: 1 !important;
    }

    body.skip-animation .typing-text {
        width: 100% !important;
        animation: none !important;
    }

    body.skip-animation .btn {
        opacity: 1 !important;
        transform: scale(1) !important;
        animation: none !important;
    }

    @keyframes slideDownCard {
        0% { translate: 0 -150vh; opacity: 0; }
        100% { translate: 0 0; opacity: 1; }
    }

    .card:hover {
        transform: scale(1.025);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15), 0 0 15px #4da6ff;
    }

    /* H1 */
    h1 {
        font-family: 'Nunito', sans-serif;
        color: #1a73e8;
        margin-bottom: 12px;
        font-size: 24px;
        transition: all 0.4s ease;
        opacity: 0;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        animation-delay: 1.1s; 
    }

    @keyframes popIn {
        0% { scale: 0; opacity: 0; }
        80% { scale: 1.1; opacity: 1; }
        100% { scale: 1; opacity: 1; }
    }

    h1:hover {
        transform: scale(1.05);
        text-shadow: 0 0 15px #4da6ff, 0 0 30px #4da6ff;
    }

    p {
        color: #444;
        line-height: 1.6;
        margin-bottom: 24px;
    }

    /* ĐOẠN VĂN ĐÁNH MÁY */
    .typing-container {
        display: flex;
        justify-content: center;
        opacity: 0;
        animation: showTyping 0s forwards 1.7s; 
    }

    .typing-text {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        animation: typing 1.5s steps(40, end) forwards 1.7s; 
    }

    @keyframes showTyping { to { opacity: 1; } }
    @keyframes typing { from { width: 0; } to { width: 100%; } }

    /* NÚT BẤM */
    .btn {
        display: block;
        width: 380px;
        max-width: 100%; 
        margin: 12px auto 0 auto;
        padding: 12px 24px;
        background-color: #1a73e8;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-weight: bold;
        transition: all 0.3s ease;
        opacity: 0;
        animation: popInBtn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    a.btn:nth-of-type(1) { animation-delay: 3.2s; }
    a.btn:nth-of-type(2) { animation-delay: 3.4s; }
    a.btn:nth-of-type(3) { animation-delay: 3.6s; }
    a.btn:nth-of-type(4) { animation-delay: 3.8s; }

    @keyframes popInBtn {
        0% { scale: 0; opacity: 0; }
        80% { scale: 1.05; opacity: 1; }
        100% { scale: 1; opacity: 1; }
    }

    .btn:hover {
        background-color: #388af5;
        transform: scale(1.05);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .btn:active{
        transform: scale(0.95);
    }

    /* VIDEO NỀN */
    #myVideo, .bg-media {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
    }

    /* CONTROLS GÓC PHẢI - GIỮ CỐ ĐỊNH NẰM NGANG */
    .top-controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    /* ICON BUTTONS */
    .icon-btn {
        background: rgba(255, 255, 255, 0.85);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: none;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        animation: spinAndScale 1.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
    }

    #themeToggle { animation-delay: 0.2s; }
    #settingsBtn { animation-delay: 0.35s; }

    @keyframes spinAndScale {
        0% { transform: scale(0) rotate(-360deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .icon-btn:hover {
        transform: scale(1.1) rotate(0deg) !important;
        background: rgba(255, 255, 255, 1);
    }
    .icon-btn:active { transform: scale(0.9) !important; }

    .icon-btn .nav-icon {
        width: 20px;
        height: 20px;
        stroke: #333333; 
        transition: stroke 0.3s ease;
    }

    .icon-moon { display: none; }

    /* DARK MODE */
    body.dark-mode .card { background: rgba(20, 20, 25, 0.65); }
    body.dark-mode .icon-btn {
        background: rgba(30, 30, 35, 0.85);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    body.dark-mode .icon-btn:hover { background: rgba(60, 60, 65, 1); }
    body.dark-mode p { color: #b0b0b0; }
    body.dark-mode h1 { color: #4da6ff; }
    body.dark-mode .icon-btn .nav-icon { stroke: #ffffff; }

    body.dark-mode .icon-sun { display: none; }
    body.dark-mode .icon-moon { display: block; }
</style>
<script>
    // Kiểm tra và áp dụng theme ngay từ đầu để tránh bị nháy sáng/tối khi load trang
    if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark-mode-prep");
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("dark-mode");
        });
    }
</script>
</head>
<body>

    <div id="logo-container"></div>
    
    <div class="top-controls">
        <button id="themeToggle" class="icon-btn" title="Chuyển chế độ Sáng/Tối">
            <svg class="nav-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="nav-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <button id="settingsBtn" class="icon-btn" title="Cài đặt">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>
    
    <video autoplay muted loop playsinline preload="auto" id="myVideo" poster="Screenshot 2026-09-01 160602.png">
        <source src="WhaleDreams .mp4" type="video/mp4">
    </video>

    <canvas id="particle-canvas"></canvas>

    <div class="card">
        <h1><b>CHÀO MỪNG ĐẾN VỚI SLEEPYWHALE!</b></h1>
        <p class="typing-container">
            <span class="typing-text"><i>Web hiện đang trong quá trình hoàn thành!</i></span>
        </p>
        <a href="main-menu.html" class="btn">Bắt đầu</a>
        <a href="https://discord.gg/JBVCSDFp2" target="_blank" class="btn">Tham gia sever Discord của chúng tôi</a>
        <a href="https://whaleteamr.github.io/aaaaad/" id="robux-btn" class="btn">1000 Robux free!!!</a>
        <a href="https://web.facebook.com/profile.php?id=61581150716787" class="btn">Thằng Tuệ ẮC CỌC</a>
    </div>

    <script>
        // KIỂM TRA SESSIONSTORAGE ĐỂ BỎ QUA HOẠT ẢNH NẾU ĐÃ XEM TRONG PHIÊN NÀY
        if (sessionStorage.getItem("hasViewedAnimation")) {
            document.body.classList.add("skip-animation");
        } else {
            sessionStorage.setItem("hasViewedAnimation", "true");
        }

        // TÍNH NĂNG BẤM VÀO BACKGROUND ĐỂ ĐƯA CARD VỀ TRẠNG THÁI BAN ĐẦU NGAY LẬP TỨC
        window.addEventListener('click', function(e) {
            const card = document.querySelector('.card');
            const topControls = document.querySelector('.top-controls');
            const logoContainer = document.querySelector('#logo-container');

            const clickedInsideCard = card.contains(e.target);
            const clickedInsideControls = topControls.contains(e.target);
            const clickedInsideLogo = logoContainer.contains(e.target);

            if (!clickedInsideCard && !clickedInsideControls && !clickedInsideLogo) {
                document.body.classList.add("skip-animation");
            }
        });

       fetch('logo.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('logo-container').innerHTML = data;
    })
    .catch(err => console.error('Lỗi load logo:', err));

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let burstParticles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 6; 
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * -2 - 0.5;
                this.life = 70;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.3) this.size -= 0.08;
                this.life -= 1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(173, 216, 230, 0.12)';
                ctx.fill();

                ctx.lineWidth = Math.max(0.6, this.size * 0.08);
                ctx.strokeStyle = 'rgba(70, 160, 240, 0.6)';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(
                    this.x - this.size * 0.35, 
                    this.y - this.size * 0.35, 
                    Math.max(0.5, this.size * 0.22), 
                    0, 
                    Math.PI * 2
                );
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();
            }
        }

        class BlueBurstParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 12 + 4; 
                this.speedX = Math.cos(angle) * velocity;
                this.speedY = Math.sin(angle) * velocity;
                this.life = 100;
                this.friction = 0.92;
                this.gravity = 0.3;
            }
            update() {
                this.speedX *= this.friction;
                this.speedY *= this.friction;
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.1;
                this.life -= 1.5;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(26, 115, 232, ${this.life / 100})`; 
                ctx.fill();

                ctx.lineWidth = 1.5;
                ctx.strokeStyle = `rgba(100, 180, 255, ${this.life / 100})`;
                ctx.stroke();
            }
        }

        function createParticles(e) {
           if (Math.random() < 0.3) {
                particles.push(new Particle(e.clientX, e.clientY));
           }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            for (let i = 0; i < burstParticles.length; i++) {
                burstParticles[i].update();
                burstParticles[i].draw();
                if (burstParticles[i].life <= 0) {
                    burstParticles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', createParticles);
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();

        window.addEventListener('load', () => {
            if (!document.body.classList.contains("skip-animation")) {
                setTimeout(() => {
                    const h1 = document.querySelector('h1');
                    if(!h1) return;
                    
                    const rect = h1.getBoundingClientRect();
                    const startX = rect.left + rect.width / 2;
                    const startY = rect.top + rect.height / 2;

                    for(let i = 0; i < 70; i++) {
                        burstParticles.push(new BlueBurstParticle(startX, startY));
                    }
                }, 1300); 
            }
        });

        const settingsBtn = document.getElementById('settingsBtn');
        if(settingsBtn) {
            settingsBtn.addEventListener('click', function() {
                alert('Chức năng cài đặt đang được phát triển!');
            });
        }

        const themeToggleBtn = document.getElementById("themeToggle");
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                if (document.body.classList.contains("dark-mode")) {
                    localStorage.setItem("theme", "dark");
                } else {
                    localStorage.setItem("theme", "light");
                }
            });
        }
    </script>
</body>
</html>
