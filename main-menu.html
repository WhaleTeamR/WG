<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu - WhaleTeam_R</title>
    <link rel="icon" type="image/png" href="Logo - 1 - Edited.png">
    <style>
        /* RESET CSS CƠ BẢN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* NỀN TOÀN TRANG WIDGET */
        body {
            background-color: #121316; /* Màu xám đen Modrinth */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        /* ==========================================
           1. THANH TÌM KIẾM (SEARCH BOX) GLASSMORPHISM
           ========================================== */
        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
            padding: 12px 24px;
            
            background: #1a1b1e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .search-box:focus-within,
        .search-box:hover {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 12px rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
        }

        /* KHỐNG CHẾ KÍCH THƯỚC KÍNH LÚP */
        .search-icon {
            width: 20px !important;
            height: 20px !important;
            min-width: 20px;
            color: #8e9297;
            flex-shrink: 0;
            transition: color 0.3s ease;
        }

        .search-box:focus-within .search-icon {
            color: #10b981;
        }

        /* Ô INPUT NHẬP TỪ KHÓA */
        .search-input {
            width: 100%;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: #8e9297;
        }


        /* ==========================================
           2. KHỐI NỘI DUNG CHÍNH (Layout Flexbox 2 cột)
           ========================================== */
        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 20px;
        }

        /* CỘT TRÁI - SIDEBAR */
        .sidebar {
            width: 260px;
            background-color: #1a1b1e;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .sidebar:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4), 0 0 10px rgba(16, 185, 129, 0.15);
        }

        .sidebar-title {
            font-size: 24px;
            font-weight: bold;
            color: #8e9297;
            margin-bottom: 10px;
            padding-left: 10px;
        }

        /* Các Nút Menu Bên Trái */
        .nav-btn {
            display: block;
            padding: 12px 18px;
            border-radius: 12px;
            color: #c9cdd1;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            background: transparent;
        }

        .nav-btn.active {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.4s ease;
        }

        .nav-btn:hover:not(.active) {
            background-color: #2b2d31;
            color: #ffffff;
            transform: translateX(4px);
        }

        .nav-btn.active:hover {
            transform: scale(1.025);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* CỘT PHẢI - CONTENT AREA */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background-color: #1a1b1e;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4), 0 0 10px rgba(16, 185, 129, 0.15);
        }

        .item-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            background-color: #2b2d31;
            flex-shrink: 0;
        }

        .item-info h3 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .item-info p {
            font-size: 14px;
            color: #9da2a8;
            line-height: 1.4;
        }

        /* RESPONSIVE TRÊN ĐIỆN THOẠI */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<!-- NƠI HIỂN THỊ LOGO -->
<div id="logo-container"></div>

<!-- SCRIPT NẠP LOGO -->
<script>
    fetch('logo.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('logo-container').innerHTML = data;
            
            // Xóa class intro sau 2.2s để trả về trạng thái hover bình thường
            const brandLogo = document.querySelector('.brand-logo');
            if (brandLogo) {
                setTimeout(() => {
                    brandLogo.classList.remove('intro-animation');
                }, 2200);
            }
        })
        .catch(err => console.error('Lỗi khi tải logo:', err));
</script>
    <!-- 1. KHỐI THANH TÌM KIẾM BÊN TRÊN -->
    <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" placeholder="Tìm kiếm...">
    </div>

    <!-- 2. KHỐI BỐ CỤC CHÍNH BÊN DƯỚI -->
    <div class="main-container">
        
        <!-- Cột Bên Trái: Danh Mục Nav -->
        <div class="sidebar">
            <div class="sidebar-title">Categories</div>
            <a href="#" class="nav-btn active">Line 1</a>
            <a href="#" class="nav-btn">Line 2</a>
            <a href="#" class="nav-btn">Line 3</a>
            <a href="#" class="nav-btn">Line 4</a>
        </div>

        <!-- Cột Bên Phải: Danh Sách Thẻ Nội Dung -->
        <div class="content-area">
            
            <!-- Card 1 -->
            <div class="item-card">
                <img src="Logo - 1 - Edited.png" alt="Icon" class="item-icon" onerror="this.src='unnamed.png'">
                <div class="item-info">
                    <h3>Name 1</h3>
                    <p>Name-1's Information</p>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="item-card">
                <img src="1.png" alt="Icon" class="item-icon" onerror="this.src='unnamed.png'">
                <div class="item-info">
                    <h3>Name 2</h3>
                    <p>Name-2's Information</p>
                </div>
            </div>

        </div>

    </div>

    <script>
        const navButtons = document.querySelectorAll('.sidebar .nav-btn');

        navButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                navButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>

</body>
</html>
