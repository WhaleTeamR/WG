<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu - WhaleTeam_R</title>
    <link rel="icon" type="image/png" href="Logo - 1 - Edited.png">
    <style>
        /* RESET CSS CƠ BẢN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* ==========================================
           1. KHAI BÁO BIẾN MÀU SẮC (MẶC ĐỊNH LÀ SÁNG)
           ========================================== */
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --hover-bg: #f9fafb;
            --hover-border: rgba(16, 185, 129, 0.5);
            --hover-glow: rgba(16, 185, 129, 0.15);
        }

        /* CHẾ ĐỘ TỐI (DARK MODE) */
        body.dark-mode {
            --bg-color: #121316;
            --card-bg: #1a1b1e;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #8e9297;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --hover-bg: #2b2d31;
            --hover-border: rgba(16, 185, 129, 0.5);
            --hover-glow: rgba(16, 185, 129, 0.2);
        }

        /* NỀN TOÀN TRANG WIDGET */
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================
           2. NÚT CHUYỂN ĐỔI CHẾ ĐỘ SÁNG / TỐI (GÓC TRÊN PHẢI)
           ========================================== */
        .theme-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
            border-color: var(--hover-border);
            box-shadow: 0 4px 15px var(--hover-glow);
        }

        .theme-toggle-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-main);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease, stroke 0.3s ease;
        }

        /* Ẩn/Hiện icon theo chế độ */
        .icon-sun { display: block; }
        .icon-moon { display: none; }

        body.dark-mode .icon-sun { display: none; }
        body.dark-mode .icon-moon { display: block; }

        /* ==========================================
           3. THANH TÌM KIẾM (SEARCH BOX)
           ========================================== */
        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
            padding: 12px 24px;
            
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            box-shadow: 0 8px 20px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .search-box:focus-within,
        .search-box:hover {
            border-color: var(--hover-border);
            box-shadow: 0 8px 25px var(--shadow-color), 0 0 12px var(--hover-glow);
            transform: translateY(-2px);
        }

        /* KHỐNG CHẾ KÍCH THƯỚC KÍNH LÚP */
        .search-icon {
            width: 20px !important;
            height: 20px !important;
            min-width: 20px;
            color: var(--text-sub);
            flex-shrink: 0;
            transition: color 0.3s ease;
        }

        .search-box:focus-within .search-icon {
            color: #10b981;
        }

        /* Ô INPUT NHẬP TỪ KHÓA */
        .search-input {
            width: 100%;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: var(--text-sub);
        }

        /* ==========================================
           4. KHỐI NỘI DUNG CHÍNH (Layout Flexbox 2 cột)
           ========================================== */
        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 20px;
        }

        /* CỘT TRÁI - SIDEBAR */
        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .sidebar:hover {
            transform: translateY(-3px);
            border-color: var(--hover-border);
            box-shadow: 0 12px 25px var(--shadow-color), 0 0 10px var(--hover-glow);
        }

        .sidebar-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 10px;
            padding-left: 10px;
        }

        /* Các Nút Menu Bên Trái */
        .nav-btn {
            display: block;
            padding: 12px 18px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            background: transparent;
        }

        .nav-btn.active {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.4s ease;
        }

        .nav-btn:hover:not(.active) {
            background-color: var(--hover-bg);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .nav-btn.active:hover {
            transform: scale(1.025);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* CỘT PHẢI - CONTENT AREA */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 16px var(--shadow-color);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: var(--hover-border);
            box-shadow: 0 12px 25px var(--shadow-color), 0 0 10px var(--hover-glow);
        }

        .item-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            background-color: var(--hover-bg);
            flex-shrink: 0;
        }

        .item-info h3 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .item-info p {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* RESPONSIVE TRÊN ĐIỆN THOẠI */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- NÚT CHUYỂN ĐỔI CHẾ ĐỘ SÁNG / TỐI -->
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <!-- ICON MẶT TRỜI (CHẾ ĐỘ SÁNG) -->
        <svg class="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- ICON MẶT TRĂNG (CHẾ ĐỘ TỐI) -->
        <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <!-- NƠI HIỂN THỊ LOGO -->
    <div id="logo-container"></div>

    <!-- SCRIPT NẠP LOGO -->
    <script>
        fetch('logo.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('logo-container').innerHTML = data;
                
                // Xóa class intro sau 2.2s để trả về trạng thái hover bình thường
                const brandLogo = document.querySelector('.brand-logo');
                if (brandLogo) {
                    setTimeout(() => {
                        brandLogo.classList.remove('intro-animation');
                    }, 2200);
                }
            })
            .catch(err => console.error('Lỗi khi tải logo:', err));
    </script>

    <!-- 1. KHỐI THANH TÌM KIẾM BÊN TRÊN -->
    <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" placeholder="Tìm kiếm...">
    </div>

    <!-- 2. KHỐI BỐ CỤC CHÍNH BÊN DƯỚI -->
    <div class="main-container">
        
        <!-- Cột Bên Trái: Danh Mục Nav -->
        <div class="sidebar">
            <div class="sidebar-title">Categories</div>
            <a href="#" class="nav-btn active">Line 1</a>
            <a href="#" class="nav-btn">Line 2</a>
            <a href="#" class="nav-btn">Line 3</a>
            <a href="#" class="nav-btn">Line 4</a>
        </div>

        <!-- Cột Bên Phải: Danh Sách Thẻ Nội Dung -->
        <div class="content-area">
            
            <!-- Card 1 -->
            <div class="item-card">
                <img src="Logo - 1 - Edited.png" alt="Icon" class="item-icon" onerror="this.src='unnamed.png'">
                <div class="item-info">
                    <h3>Name 1</h3>
                    <p>Name-1's Information</p>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="item-card">
                <img src="1.png" alt="Icon" class="item-icon" onerror="this.src='unnamed.png'">
                <div class="item-info">
                    <h3>Name 2</h3>
                    <p>Name-2's Information</p>
                </div>
            </div>

        </div>

    </div>

    <!-- SCRIPT CHUYỂN ĐỔI GIAO DIỆN & XỬ LÝ ACTIVE BUTTON -->
    <script>
        // 1. Quản lý Theme Light/Dark Mode
        const themeToggleBtn = document.getElementById("themeToggle");
        const savedTheme = localStorage.getItem("theme");

        // Đọc cài đặt trước đó (nếu đã từng bật Dark)
        if (savedTheme === "dark") {
            document.body.classList.add("dark-mode");
        }

        // Sự kiện click chuyển chế độ
        themeToggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
            } else {
                localStorage.setItem("theme", "light");
            }
        });

        // 2. Quản lý trạng thái Active cho các nút Sidebar
        const navButtons = document.querySelectorAll('.sidebar .nav-btn');

        navButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                navButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>

</body>
</html>
